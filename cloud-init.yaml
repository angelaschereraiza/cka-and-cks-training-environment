#cloud-config
package_update: true
users:
- default
- name: student
  groups: sudo
  shell: /bin/bash
  sudo:
  - ALL=(ALL) NOPASSWD:ALL
  ssh_authorized_keys:
  - ${ssh_public_key}
disable_root: true
ssh_pwauth: false
write_files:
- path: /etc/modules-load.d/kubernetes.conf
  permissions: '0644'
  content: |
    overlay
    br_netfilter
- path: /etc/sysctl.d/kubernetes.conf
  permissions: '0644'
  content: |
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward = 1
- path: /etc/profile.d/kubernetes.sh
  permissions: '0644'
  content: |
    export EDITOR=vim
    export VISUAL=vim
    export KUBE_EDITOR=vim
- path: /etc/profile.d/cks-alias.sh
  permissions: '0644'
  content: |
    alias k=kubectl
- path: /etc/crictl.yaml
  permissions: '0644'
  content: |
    runtime-endpoint: unix:///run/containerd/containerd.sock
    image-endpoint: unix:///run/containerd/containerd.sock
    timeout: 10
- path: /opt/cks/manifests/01-network.yaml
  permissions: '0644'
  content: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: production
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: database
      namespace: production
    spec:
      replicas: 1
      selector:
        matchLabels: {app: database}
      template:
        metadata:
          labels: {app: database}
        spec:
          containers:
            - name: postgres
              image: postgres:16-alpine
              env:
                - name: POSTGRES_PASSWORD
                  value: cks-lab-only
              ports:
                - containerPort: 5432
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
      namespace: production
    spec:
      replicas: 1
      selector:
        matchLabels: {role: backend}
      template:
        metadata:
          labels: {role: backend}
        spec:
          containers:
            - name: client
              image: postgres:16-alpine
              command: ["sh", "-c", "sleep infinity"]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unauthorized-client
      namespace: production
    spec:
      replicas: 1
      selector:
        matchLabels: {role: frontend}
      template:
        metadata:
          labels: {role: frontend}
        spec:
          containers:
            - name: client
              image: postgres:16-alpine
              command: ["sh", "-c", "sleep infinity"]
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: database
      namespace: production
    spec:
      selector: {app: database}
      ports:
        - port: 5432
          targetPort: 5432
- path: /opt/cks/manifests/02-rbac.yaml
  permissions: '0644'
  content: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: cks-rbac
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: report-reader
      namespace: cks-rbac
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: report-access
      namespace: cks-rbac
    rules:
      - apiGroups: [""]
        resources: ["configmaps", "secrets", "pods"]
        verbs: ["get", "list", "watch", "create", "delete"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: report-binding
      namespace: cks-rbac
    subjects:
      - kind: ServiceAccount
        name: report-reader
        namespace: cks-rbac
    roleRef:
      kind: Role
      name: report-access
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: daily-report
      namespace: cks-rbac
    data:
      report: "CKS lab report"
- path: /opt/cks/manifests/03-pod-security.yaml
  permissions: '0644'
  content: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: cks-pod-security
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: insecure-web
      namespace: cks-pod-security
    spec:
      replicas: 1
      selector:
        matchLabels: {app: insecure-web}
      template:
        metadata:
          labels: {app: insecure-web}
        spec:
          containers:
            - name: web
              image: nginx:1.27-alpine
              securityContext:
                allowPrivilegeEscalation: true
                runAsUser: 0
                capabilities:
                  add: ["NET_RAW"]
