#cloud-config
users:
- default
- name: student
  groups: sudo
  shell: /bin/bash
  sudo:
  - ALL=(ALL) NOPASSWD:ALL
  ssh_authorized_keys:
  - ${ssh_public_key}
disable_root: true
ssh_pwauth: false
write_files:
- path: /etc/modules-load.d/kubernetes.conf
  permissions: '0644'
  content: |
    overlay
    br_netfilter
- path: /etc/sysctl.d/kubernetes.conf
  permissions: '0644'
  content: |
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward = 1
- path: /etc/profile.d/kubernetes.sh
  permissions: '0644'
  content: |
    export EDITOR=vim
    export VISUAL=vim
    export KUBE_EDITOR=vim
- path: /etc/profile.d/cks-alias.sh
  permissions: '0644'
  content: |
    alias k=kubectl
- path: /etc/crictl.yaml
  permissions: '0644'
  content: |
    runtime-endpoint: unix:///run/containerd/containerd.sock
    image-endpoint: unix:///run/containerd/containerd.sock
    timeout: 10
