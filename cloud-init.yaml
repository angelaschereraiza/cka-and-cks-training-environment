- path: /usr/local/sbin/cks-node-install.sh
  permissions: '0755'
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    exec > >(tee -a /var/log/cks-provision.log) 2>&1
    trap 'echo "CKS provisioning failed at line $LINENO: $BASH_COMMAND" >&2' ERR
    export DEBIAN_FRONTEND=noninteractive
    swapoff -a
    sed -i.bak -E '/^[^#].*[[:space:]]swap[[:space:]]/s/^/#/' /etc/fstab
    modprobe overlay
    modprobe br_netfilter
    sysctl --system
    apt-get update
    apt-get install -y ca-certificates curl gnupg apt-transport-https containerd apparmor apparmor-utils auditd jq git vim tar gzip unzip tcpdump iproute2 iptables nftables procps util-linux findutils dnsutils iputils-ping openssl strace lsof libseccomp2
    CRICTL_VERSION="v1.36.0"
    ARCH="$(dpkg --print-architecture)"
    curl -fsSLo /tmp/crictl.tar.gz "https://github.com/kubernetes-sigs/cri-tools/releases/download/$${CRICTL_VERSION}/crictl-$${CRICTL_VERSION}-linux-$${ARCH}.tar.gz"
    tar -xzf /tmp/crictl.tar.gz -C /usr/local/bin crictl
    chmod 755 /usr/local/bin/crictl
    rm /tmp/crictl.tar.gz
    crictl --version
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
    systemctl enable --now containerd
    systemctl restart containerd
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL 'https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key' | gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
    apt-get update
    # Keep the image's existing dpkg configuration non-interactively.
    apt-get install -y -o Dpkg::Options::="--force-confold" kubelet kubeadm kubectl
    # Write kubelet overrides only after dpkg has installed its conffiles.
    printf '%s\n' 'KUBELET_EXTRA_ARGS="--node-ip=${node_ip}"' > /etc/default/kubelet
    apt-mark hold kubelet kubeadm kubectl
    systemctl enable kubelet
    systemctl enable --now apparmor
    systemctl enable --now auditd
    mkdir -p /var/lib/kubelet/seccomp/profiles /etc/apparmor.d /opt/cks/logs
    install -d -m 0755 /var/lib/cka/volumes/local-data
    cp /opt/cks/policies/04-seccomp-deny-chmod.json /var/lib/kubelet/seccomp/profiles/cks-deny-chmod.json
    cp /opt/cks/policies/05-apparmor-profile /etc/apparmor.d/cks-deny-write
    apparmor_parser -r /etc/apparmor.d/cks-deny-write
    # Falco is mandatory for the runtime-security exercises.
    install -m 0755 -d /usr/share/keyrings
    curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | gpg --batch --yes --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
    chmod 0644 /usr/share/keyrings/falco-archive-keyring.gpg
    printf '%s\n' 'deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main' > /etc/apt/sources.list.d/falcosecurity.list
    apt-get update
    FALCO_FRONTEND=noninteractive FALCO_DRIVER_CHOICE=modern_ebpf FALCOCTL_ENABLED=no apt-get install -y -o Dpkg::Options::="--force-confold" falco
    # Preserve the exercise rules and load them alongside Falco's default rules.
    touch /etc/falco/falco_rules.local.yaml
    # Leave Falco local rules empty for the student to solve.
    # A separate training directory contains only scenario data.
    systemctl daemon-reload
    systemctl enable --now falco-modern-bpf.service
    systemctl is-active --quiet falco-modern-bpf.service
    command -v falco
    falco --version
    # Helm CLI on the control-plane node for CKA exercises.
    if [[ $(hostname -s) == k8s-control-1 ]]; then
      HELM_VERSION=v3.19.0
      HELM_SHA256=a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
      if curl --retry 3 -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" && printf '%s  %s\n' "$HELM_SHA256" /tmp/helm.tar.gz | sha256sum -c -; then
        tar -xzf /tmp/helm.tar.gz -C /tmp
        install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
        helm version --short
      else
        echo 'WARNING: Helm could not be installed; core cluster setup continues.' >&2
      fi
      rm -rf /tmp/linux-amd64 /tmp/helm.tar.gz
    fi
    # Install Trivy
    install -m 0755 -d /usr/share/keyrings
    curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --batch --yes --dearmor -o /usr/share/keyrings/trivy.gpg
    chmod 0644 /usr/share/keyrings/trivy.gpg
    printf '%s\n' 'deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main' > /etc/apt/sources.list.d/trivy.list
    apt-get update
    apt-get install -y trivy
    trivy --version
    # Install Cosign
    curl -fsSL https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 -o /usr/local/bin/cosign
    chmod 755 /usr/local/bin/cosign
    cosign version
    systemctl daemon-reload
    if [[ $(hostname -s) == k8s-control-1 ]]; then
      systemctl enable cks-lab.service
      systemctl --no-block start cks-lab.service
    fi
    echo 'CKS node provisioning completed.'
- path: /usr/local/sbin/cks-lab-apply.sh
  permissions: '0755'
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    until test -s "$KUBECONFIG"; do sleep 10; done
    until kubectl --request-timeout=5s get nodes >/dev/null 2>&1; do sleep 10; done
    until kubectl -n kube-system get ds cilium >/dev/null 2>&1; do sleep 10; done
    kubectl -n kube-system rollout status ds/cilium --timeout=10m
    kubectl apply -f /opt/cks/manifests/
    kubectl apply -f /opt/cka/manifests/00-namespaces.yaml
    kubectl label nodes k8s-worker-1 cka.lab/zone=west --overwrite
    kubectl label nodes k8s-worker-2 cka.lab/zone=east --overwrite
    kubectl apply -f /opt/cka/fixtures/crd/widgets.yaml
    kubectl wait --for=condition=Established crd/widgets.lab.example.com --timeout=90s
    kubectl apply -f /opt/cka/manifests/
    # Stage broken control-plane and node configuration off the live manifest paths.
    install -d /opt/cka/fixtures/control-plane /opt/cka/fixtures/kubelet
    sed 's@/etc/kubernetes/scheduler.conf@/etc/kubernetes/missing-scheduler.conf@g' /etc/kubernetes/manifests/kube-scheduler.yaml > /opt/cka/fixtures/control-plane/kube-scheduler-broken.yaml
    sed 's/cgroupDriver: systemd/cgroupDriver: invalid-driver/g' /var/lib/kubelet/config.yaml > /opt/cka/fixtures/kubelet/config-broken.yaml
    /usr/local/sbin/openssl-lab-apply.sh
    /usr/local/sbin/cka-extended-apply.sh
- path: /usr/local/sbin/openssl-lab-apply.sh
  permissions: '0755'
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    umask 077
    base=/opt/cka/fixtures/openssl
    install -d -m 0700 -o student -g student "$base" /home/student/openssl
    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    cd "$work"
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj '/CN=Training Root CA' -keyout ca.key -out ca.crt -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
    openssl req -new -newkey rsa:2048 -nodes -subj '/CN=tls-web.cka-openssl.svc' -keyout web.key -out web.csr
    printf '%s\n' 'basicConstraints=CA:FALSE' 'keyUsage=digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' 'subjectAltName=DNS:tls-web.cka-openssl.svc,DNS:tls-web.cka-openssl.svc.cluster.local' > web.ext
    openssl x509 -req -in web.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 -extfile web.ext -out web.crt
    openssl req -new -newkey rsa:2048 -nodes -subj '/CN=lab-client/O=training' -keyout client.key -out client.csr
    openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out alternate.key
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj '/CN=Other Root CA' -keyout other.key -out other.crt
    printf 'Kubernetes OpenSSL training\n' > message.txt
    openssl dgst -sha256 -sign web.key -out message.sig message.txt
    for f in ca.crt web.crt web.key client.csr client.key alternate.key other.crt message.txt message.sig; do
      install -m 0600 -o student -g student "$f" "$base/$f"
    done
    kubectl create namespace cka-openssl --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n cka-openssl create secret tls web-tls --cert=web.crt --key=web.key --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n cka-openssl create configmap web-config --from-literal=default.conf='server { listen 443 ssl; server_name tls-web.cka-openssl.svc; ssl_certificate /tls/tls.crt; ssl_certificate_key /tls/tls.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "openssl lab\n"; } }' --dry-run=client -o yaml | kubectl apply -f -
    kubectl apply -f /opt/cka/fixtures/openssl-web.yaml
