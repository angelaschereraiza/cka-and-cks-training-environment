    kind: Service
    metadata:
      name: datastore
      namespace: cks-net-data
    spec:
      selector: {app: datastore}
      ports:
      - name: postgres
        protocol: TCP
        port: 5432
        targetPort: 5432
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: trusted-client
      namespace: cks-net-trusted
    spec:
      replicas: 1
      selector:
        matchLabels: {role: app-client}
      template:
        metadata:
          labels: {role: app-client}
        spec:
          containers:
          - name: client
            image: postgres:16-alpine
            command: ["sh", "-c", "sleep infinity"]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: untrusted-client
      namespace: cks-net-untrusted
    spec:
      replicas: 1
