- path: /opt/cks/manifests/10-incident.yaml
  permissions: '0644'
  content: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: cks-incident
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: application
      namespace: cks-incident
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: application-role
      namespace: cks-incident
    rules:
      - apiGroups: [""]
        resources: ["pods", "secrets", "configmaps"]
        verbs: ["get", "list", "watch"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: application-binding
      namespace: cks-incident
    subjects:
      - kind: ServiceAccount
        name: application
        namespace: cks-incident
    roleRef:
      kind: Role
      name: application-role
      apiGroup: rbac.authorization.k8s.io
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: incident-app
      namespace: cks-incident
    spec:
      replicas: 1
      selector:
        matchLabels: {app: incident-app}
      template:
        metadata:
          labels: {app: incident-app}
        spec:
          serviceAccountName: application
          containers:
            - name: app
              image: nginx:1.27-alpine
              securityContext:
                allowPrivilegeEscalation: true
                runAsUser: 0
- path: /opt/cks/policies/08-audit-policy.yaml
  permissions: '0644'
  content: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
      - level: Metadata
        resources:
          - group: ""
            resources: ["secrets", "configmaps"]
      - level: None
        users: ["system:kube-proxy"]
      - level: Metadata
- path: /opt/cks/policies/04-seccomp-deny-chmod.json
  permissions: '0644'
  content: |
    {
      "defaultAction": "SCMP_ACT_ALLOW",
      "syscalls": [
        {
          "names": [
            "chmod",
            "fchmod",
            "fchmodat"
          ],
          "action": "SCMP_ACT_ERRNO"
        }
      ]
    }
- path: /opt/cks/policies/05-apparmor-profile
  permissions: '0644'
  content: |
    #include <tunables/global>
    profile cks-deny-write flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>
      file,
      deny /tmp/cks-denied rw,
    }
