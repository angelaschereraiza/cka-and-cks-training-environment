---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: cka-dynamic-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive
  namespace: cka-dynamic-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: archive-storage
  resources:
    requests:
      storage: 128Mi
