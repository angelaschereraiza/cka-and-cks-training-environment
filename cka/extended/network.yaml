---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cka-diagnostics
spec:
  selector:
    app: backend-v2
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: backend
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: resolver
  namespace: cka-dns
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
    - 192.0.2.53
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - '360000'
