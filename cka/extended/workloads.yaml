---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: cka-gateway
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: catalog
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: cka-gateway
spec:
  selector:
    app: catalog
  ports:
  - port: 80
    targetPort: 80
