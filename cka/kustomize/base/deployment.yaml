apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlay-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overlay-web
  template:
    metadata:
      labels:
        app: overlay-web
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
