apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: cka-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: portal.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portal
            port:
              number: 8080
