apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cka-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cka-local-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cka-local
  local:
    path: /var/lib/cka/volumes/local-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-worker-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pending-claim
  namespace: cka-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: cka-local
  resources:
    requests:
      storage: 3Gi
