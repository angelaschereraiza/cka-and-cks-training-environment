apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: cka-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auditor-role
  namespace: cka-rbac
rules:
- apiGroups: ['']
  resources: ['pods', 'configmaps', 'secrets']
  verbs: ['get', 'list', 'watch', 'create', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-binding
  namespace: cka-rbac
subjects:
- kind: ServiceAccount
  name: auditor
  namespace: cka-rbac
roleRef:
  kind: Role
  name: auditor-role
  apiGroup: rbac.authorization.k8s.io
