apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: cka-network
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-svc
  namespace: cka-network
spec:
  type: ClusterIP
  selector:
    app: storefront-old
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: cka-network
  labels:
    role: client
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ['sh', '-c', 'sleep 360000']
