apiVersion: v1
kind: ConfigMap
metadata:
  name: service-settings
  namespace: cka-config
data:
  APP_MODE: production
  APP_COLOR: blue
---
apiVersion: v1
kind: Secret
metadata:
  name: service-credentials
  namespace: cka-config
type: Opaque
stringData:
  API_KEY: cka-lab-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configured-api
  namespace: cka-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configured-api
  template:
    metadata:
      labels:
        app: configured-api
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        envFrom:
        - configMapRef:
            name: service-setting
        ports:
        - containerPort: 80
