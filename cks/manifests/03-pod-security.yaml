apiVersion: v1
kind: Namespace
metadata:
  name: cks-pod-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
  namespace: cks-pod-security
spec:
  replicas: 1
  selector:
    matchLabels: {app: insecure-web}
  template:
    metadata:
      labels: {app: insecure-web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add: ["NET_RAW"]
