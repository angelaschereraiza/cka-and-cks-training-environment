apiVersion: v1
kind: Namespace
metadata:
  name: cks-rbac
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-reader
  namespace: cks-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-access
  namespace: cks-rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-binding
  namespace: cks-rbac
subjects:
  - kind: ServiceAccount
    name: report-reader
    namespace: cks-rbac
roleRef:
  kind: Role
  name: report-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-report
  namespace: cks-rbac
data:
  report: "CKS lab report"
