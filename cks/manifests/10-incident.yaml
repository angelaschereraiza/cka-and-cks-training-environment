apiVersion: v1
kind: Namespace
metadata:
  name: cks-incident
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: application
  namespace: cks-incident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-role
  namespace: cks-incident
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-binding
  namespace: cks-incident
subjects:
  - kind: ServiceAccount
    name: application
    namespace: cks-incident
roleRef:
  kind: Role
  name: application-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-app
  namespace: cks-incident
spec:
  replicas: 1
  selector:
    matchLabels: {app: incident-app}
  template:
    metadata:
      labels: {app: incident-app}
    spec:
      serviceAccountName: application
      containers:
        - name: app
          image: nginx:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
