apiVersion: v1
kind: Namespace
metadata:
  name: cks-psa-advanced
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: cks-psa-advanced
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-api}
  template:
    metadata:
      labels: {app: legacy-api}
    spec:
      containers:
      - name: api
        image: alpine:3.21
        command: ["sh", "-c", "sleep 360000"]
        securityContext:
          privileged: true
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add: ["NET_RAW"]
