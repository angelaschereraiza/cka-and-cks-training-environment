apiVersion: v1
kind: Namespace
metadata:
  name: cks-supply-chain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-web
  namespace: cks-supply-chain
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-web}
  template:
    metadata:
      labels: {app: legacy-web}
    spec:
      containers:
        - name: web
          image: nginx:1.19
          imagePullPolicy: IfNotPresent
