apiVersion: v1
kind: Namespace
metadata:
  name: cks-apparmor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apparmor-instructions
  namespace: cks-apparmor
data:
  lab: "apparmor"
---
apiVersion: v1
kind: Pod
metadata:
  name: apparmor-target
  namespace: cks-apparmor
spec:
  containers:
    - name: target
      image: busybox:1.36
      command: ["sh", "-c", "sleep 360000"]
